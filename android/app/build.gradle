plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Google services Gradle plugin
    id "com.google.gms.google-services"
}

// Load signing credentials from android/key.properties (not committed to VCS).
// To create a release keystore, run:
//   keytool -genkey -v -keystore android/app/release-keystore.jks \
//     -alias upload -keyalg RSA -keysize 2048 -validity 10000
// Then create android/key.properties with:
//   storePassword=<your-store-password>
//   keyPassword=<your-key-password>
//   keyAlias=upload
//   storeFile=release-keystore.jks
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.salah.footballtraining"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.salah.footballtraining"
        minSdk = 23
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        
        // Enable multiDex for large applications
        multiDexEnabled = true
        
        // Optimize for release builds
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
        
        release {
            // Production store uploads MUST have key.properties present.
            // CI build-verification jobs intentionally use the debug key so the
            // app can be compiled and tested without exposing keystore secrets.
            // Never upload a debug-signed APK/AAB to a public distribution channel.
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Optimize build for production
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
    }
    
    // Production optimizations
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Core library desugaring for flutter_local_notifications
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // Firebase dependencies are handled by FlutterFire CLI
}
